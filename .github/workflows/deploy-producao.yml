name: Deploy produção

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/370037918335/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-action-deploy@predeti-site.iam.gserviceaccount.com
      - run: npx --yes firebase-tools deploy --only hosting:atoshub-predeti --project predeti-site --non-interactive
